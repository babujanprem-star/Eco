<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoAtmo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <a href="{{ url_for('home') }}" class="logo"><span>🌱</span> EcoAtmo</a>
        <nav>
            <ul>
                <li><a href="{{ url_for('home') }}" class="{% if active_page == 'home' %}active{% endif %}">Home</a></li>
                <li><a href="{{ url_for('air_quality') }}" class="{% if active_page == 'air_quality' %}active{% endif %}">Air Quality</a></li>
                <li><a href="{{ url_for('countries') }}" class="{% if active_page == 'countries' %}active{% endif %}">Global AQI</a></li>
                <li><a href="{{ url_for('about') }}" class="{% if active_page == 'about' %}active{% endif %}">About</a></li>
                <li><a href="{{ url_for('services') }}" class="{% if active_page == 'services' %}active{% endif %}">Services</a></li>
                <li><a href="{{ url_for('contact') }}" class="{% if active_page == 'contact' %}active{% endif %}">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <footer>
        &copy; 2026 EcoAtmo
    </footer>

    <script src="{{ url_for('static', filename='js/page-transition.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
