services:
  - type: web
    name: ecoatmo
    runtime: python
    plan: starter
    rootDir: ecosite_project
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/database.db
    disk:
      name: ecoatmo-data
      mountPath: /var/data
      sizeGB: 1
