
services:
  - type: web
    name: ecoatmo
    runtime: python
    plan: free
    rootDir: ecosite_project
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/database.db
